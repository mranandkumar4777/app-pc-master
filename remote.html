<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16140F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Remote">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Presenter — Remote</title>
<style>
  :root{
    --bg:#16140F; --panel:#1E1A13; --panel-2:#272117; --border:#3A3223;
    --text:#F2EEE4; --text-dim:#A79E8A; --gold:#C9A227; --gold-soft:rgba(201,162,39,.16);
    --red:#8A3324; --red-bright:#C1462E; --preview:#6F94A6; --preview-soft:rgba(111,148,166,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}
  body{padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);}
  button{font-family:inherit;}
  .hidden{display:none !important;}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 32px;}

  header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 16px;}
  header h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.01em;}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--red-bright);flex:0 0 auto;}
  .status-dot.online{background:#4C9A5A;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:12px;}
  .card-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--panel-2);color:var(--text-dim);letter-spacing:.04em;}
  .badge.is-live{background:var(--red-bright);color:#fff;}
  .slide-text{font-size:19px;line-height:1.45;min-height:1.45em;white-space:pre-wrap;}
  .slide-subtitle{font-size:13px;color:var(--text-dim);margin-top:6px;}
  .card.live-card{border-color:var(--red-bright);}
  .card.preview-card{border-color:var(--gold);}

  .transport{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .transport button{padding:18px 10px;font-size:16px;font-weight:600;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);}
  .transport button:active{background:#332C1F;}
  .edge-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .edge-row button{padding:11px 10px;font-size:13px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text-dim);}
  .edge-row button:active{background:var(--panel-2);}

  .action-row{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-bottom:20px;}
  #goLiveBtn{padding:20px 10px;font-size:17px;font-weight:700;border-radius:8px;border:1px solid var(--red-bright);background:var(--red-bright);color:#fff;}
  #goLiveBtn:active{background:#A5382A;}
  #blankBtn{padding:20px 10px;font-size:15px;font-weight:600;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);}
  #blankBtn:active{background:#332C1F;}

  .ws-card{margin-bottom:14px;}
  .ws-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .ws-chip{padding:9px 14px;font-size:13px;border-radius:20px;border:1px solid var(--border);background:var(--panel);color:var(--text-dim);}
  .ws-chip:active{background:var(--panel-2);}
  .ws-chip.active{border-color:var(--gold);background:var(--gold-soft);color:var(--gold);}
  .search{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:15px;margin-bottom:10px;}
  .search::placeholder{color:var(--text-dim);}
  .items-list{display:flex;flex-direction:column;gap:6px;max-height:38vh;overflow-y:auto;}
  .item-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:6px;border:1px solid var(--border);background:var(--panel);cursor:pointer;}
  .item-row:active{background:var(--panel-2);}
  .item-row.selected{border-color:var(--gold);background:var(--gold-soft);}
  .item-title{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item-tag{flex:0 0 auto;font-size:10px;color:var(--text-dim);border:1px solid var(--border);border-radius:20px;padding:2px 8px;}
  .empty-hint{color:var(--text-dim);font-size:13px;padding:10px 2px;}

  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .gate-box{max-width:340px;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:26px 22px;text-align:center;}
  .gate-box h1{font-size:18px;margin:0 0 6px;}
  .gate-box p{font-size:13px;color:var(--text-dim);margin:0 0 18px;line-height:1.5;}
  .gate-input{width:100%;padding:14px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:22px;text-align:center;letter-spacing:.12em;margin-bottom:12px;}
  .gate-input::placeholder{color:var(--text-dim);letter-spacing:normal;font-size:14px;}
  .gate-btn{width:100%;padding:14px;border-radius:8px;border:1px solid var(--gold);background:var(--gold);color:#16140F;font-size:15px;font-weight:700;}
  .gate-btn:active{background:#B08F22;}
  .gate-error{color:#E0796A;font-size:13px;margin-top:12px;min-height:1.2em;}
  html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
  button,.item-row,.card{touch-action:manipulation;-webkit-user-select:none;user-select:none;}
</style>
</head>
<body>

<div class="gate" id="gateScreen">
  <div class="gate-box">
    <h1>Presenter Remote</h1>
    <p>Enter the connection PIN from Presenter (📱 Phone).</p>
    <input class="gate-input" id="pinInput" type="password" maxlength="64" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="current-password" placeholder="Connection PIN">
    <button class="gate-btn" id="pinSubmitBtn">Connect</button>
    <div class="gate-error" id="pinError"></div>
  </div>
</div>

<div class="wrap hidden" id="remoteScreen">
  <header>
    <h1>Presenter Remote</h1>
    <div class="status"><span class="status-dot" id="statusDot"></span><span id="statusText">Connecting…</span></div>
  </header>

  <div class="card live-card">
    <div class="card-label"><span>On screen</span><span class="badge" id="liveBadge">OFF AIR</span></div>
    <div class="slide-text" id="liveText"></div>
    <div class="slide-subtitle" id="liveSubtitle"></div>
  </div>

  <div class="card preview-card">
    <div class="card-label"><span>Staged next</span></div>
    <div class="slide-text" id="previewText">(nothing staged)</div>
    <div class="slide-subtitle" id="previewSubtitle"></div>
  </div>

  <div class="transport">
    <button id="prevBtn">‹ Prev</button>
    <button id="nextBtn">Next ›</button>
  </div>
  <div class="edge-row">
    <button id="homeBtn">First line</button>
    <button id="endBtn">Last line</button>
  </div>
  <div class="action-row">
    <button id="goLiveBtn">Send Live</button>
    <button id="blankBtn">Blank</button>
  </div>

  <div class="card ws-card hidden" id="wsCard">
    <div class="card-label"><span>Workspace (computer layout)</span></div>
    <div class="ws-chips" id="wsChips"></div>
  </div>

  <input class="search" id="searchInput" type="text" placeholder="Search songs…">
  <div class="items-list" id="itemsList"></div>
  <div class="empty-hint" id="installHint">Tip: browser menu → “Add to Home Screen” to open this as a full-screen app.</div>
</div>

<script>
(function(){
  const origin = location.origin;
  const PIN_KEY = 'presenterRemotePin';

  const gateScreen = document.getElementById('gateScreen');
  const remoteScreen = document.getElementById('remoteScreen');
  const pinInput = document.getElementById('pinInput');
  const pinSubmitBtn = document.getElementById('pinSubmitBtn');
  const pinError = document.getElementById('pinError');

  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const liveText = document.getElementById('liveText');
  const liveSubtitle = document.getElementById('liveSubtitle');
  const liveBadge = document.getElementById('liveBadge');
  const previewText = document.getElementById('previewText');
  const previewSubtitle = document.getElementById('previewSubtitle');
  const itemsList = document.getElementById('itemsList');
  const searchInput = document.getElementById('searchInput');
  const blankBtn = document.getElementById('blankBtn');

  // --- who am I? The computer lists every connected phone by this name, and can remove it. ---
  // The Android app puts its own id and name into the user agent; a browser makes up an id once.
  const ID_KEY = 'presenterRemoteId';
  function makeId(){
    try{ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
    return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
  }
  const identity = (function(){
    const ua = navigator.userAgent || '';
    const app = ua.match(/PresenterRemoteApp id=([A-Za-z0-9._-]+) name=(\S*)/);
    if(app){
      let n = app[2]; try{ n = decodeURIComponent(n); }catch(e){}
      return { id: app[1], name: n || 'Android phone' };
    }
    let id = null;
    try{ id = localStorage.getItem(ID_KEY); }catch(e){}
    if(!id || !/^[A-Za-z0-9._-]{6,64}$/.test(id)){
      id = makeId();
      try{ localStorage.setItem(ID_KEY, id); }catch(e){}
    }
    let name = 'Phone';
    const m = ua.match(/Android [^;)]*; ([^;)]+?)(?: Build\/|\))/);
    if(/iPhone/.test(ua)) name = 'iPhone';
    else if(/iPad/.test(ua)) name = 'iPad';
    else if(m && m[1] && m[1].trim().length > 1) name = m[1].trim();
    else if(/Android/.test(ua)) name = 'Android phone';
    return { id: id, name: name };
  })();
  const idQuery = '&id=' + encodeURIComponent(identity.id) + '&name=' + encodeURIComponent(identity.name);

  let pin = null;
  let pollTimer = null;
  let currentItems = [];
  let selectedItemId = null;

  function send(type, extra){
    const payload = Object.assign({ from:'remote', type: type, pin: pin, id: identity.id, name: identity.name }, extra || {});
    fetch(origin + '/api/send', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    }).then(function(r){
      if(r.status === 403){ handleRemoved(); }
      else if(r.status === 401){ pin = null; localStorage.removeItem(PIN_KEY); showGate('That PIN stopped working — enter the current one.'); }
    }).catch(function(){ setStatus(false); });
  }

  function setStatus(connected){
    statusDot.classList.toggle('online', connected);
    statusText.textContent = connected ? 'Connected' : 'Reconnecting…';
  }

  function renderItems(){
    const term = searchInput.value.trim().toLowerCase();
    itemsList.innerHTML = '';
    const filtered = term ? currentItems.filter(function(i){ return i.title.toLowerCase().indexOf(term) !== -1; }) : currentItems;
    if(filtered.length === 0){
      const p = document.createElement('div');
      p.className = 'empty-hint';
      p.textContent = currentItems.length === 0 ? 'Nothing in the library yet — add a song on the Control screen.' : 'No matches.';
      itemsList.appendChild(p);
      return;
    }
    filtered.forEach(function(item){
      const row = document.createElement('div');
      row.className = 'item-row' + (item.id === selectedItemId ? ' selected' : '');
      const title = document.createElement('div');
      title.className = 'item-title';
      title.textContent = item.title;
      const tag = document.createElement('div');
      tag.className = 'item-tag';
      tag.textContent = 'Song';
      row.appendChild(title); row.appendChild(tag);
      row.addEventListener('click', function(){
        selectedItemId = item.id;
        renderItems();
        send('select', { itemId: item.id });
      });
      itemsList.appendChild(row);
    });
  }

  searchInput.addEventListener('input', renderItems);

  document.getElementById('prevBtn').addEventListener('click', function(){ send('prev'); });
  document.getElementById('nextBtn').addEventListener('click', function(){ send('next'); });
  document.getElementById('homeBtn').addEventListener('click', function(){ send('home'); });
  document.getElementById('endBtn').addEventListener('click', function(){ send('end'); });
  document.getElementById('goLiveBtn').addEventListener('click', function(){ send('golive'); });
  blankBtn.addEventListener('click', function(){ send('blank'); });

  // Workspace chips: tap to switch the computer's panel layout. Phones can only switch between saved
  // workspaces; creating, editing and deleting them is done on the computer.
  const wsCard = document.getElementById('wsCard');
  const wsChips = document.getElementById('wsChips');
  function renderWorkspaces(w){
    if(!w || !Array.isArray(w.names) || !w.names.length){ wsCard.classList.add('hidden'); return; }
    wsCard.classList.remove('hidden');
    wsChips.innerHTML = '';
    w.names.forEach(function(name){
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'ws-chip' + (name === w.active ? ' active' : '');
      b.textContent = name;
      b.addEventListener('click', function(){
        Array.prototype.forEach.call(wsChips.children, function(c){ c.classList.toggle('active', c === b); });
        send('workspace', { name: name });
      });
      wsChips.appendChild(b);
    });
  }

  function applyState(msg){
    renderWorkspaces(msg.workspace);
    currentItems = msg.items || [];
    selectedItemId = msg.selectedItemId || null;
    renderItems();
    const p = msg.preview || {};
    previewText.textContent = p.text ? p.text : '(nothing staged)';
    previewSubtitle.textContent = p.subtitle || '';
    const l = msg.live || {};
    const liveOn = !!(l.text && !l.blank);
    liveText.textContent = liveOn ? l.text : '';
    liveSubtitle.textContent = liveOn ? (l.subtitle || '') : '';
    liveBadge.textContent = liveOn ? 'LIVE' : 'OFF AIR';
    liveBadge.classList.toggle('is-live', liveOn);
    blankBtn.textContent = liveOn ? 'Blank' : 'Show Live';
  }

  let es = null;
  function connect(){
    if(es) es.close();
    es = new EventSource(origin + '/events?pin=' + encodeURIComponent(pin) + idQuery);
    es.onopen = function(){ setStatus(true); };
    es.onerror = function(){
      setStatus(false);
      // The browser gives up for good when the computer refuses the connection (removed / wrong password): find out which.
      if(es && es.readyState === EventSource.CLOSED){ checkAccess(); }
    };
    es.onmessage = function(ev){
      setStatus(true);
      let msg;
      try { msg = JSON.parse(ev.data); } catch(e){ return; }
      if(msg && msg.from === 'server'){
        if(msg.type === 'removed'){ handleRemoved(); }
        else if(msg.type === 'signout'){ stopRemote(); pin = null; localStorage.removeItem(PIN_KEY); showGate('The PIN was changed on the computer — enter the new one.'); }
        return;
      }
      if(!msg || msg.from !== 'control' || msg.type !== 'state') return;
      applyState(msg);
    };
  }

  function stopRemote(){
    if(es){ es.onerror = null; es.close(); es = null; }
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  }

  // The computer removed this phone: stop everything, forget the password, say so.
  function handleRemoved(){
    stopRemote();
    pin = null;
    try{ localStorage.removeItem(PIN_KEY); }catch(e){}
    showGate('This phone was removed from Presenter on the computer.');
  }

  function checkAccess(){
    if(!pin) return;
    fetch(origin + '/api/verify-pin?pin=' + encodeURIComponent(pin) + '&id=' + encodeURIComponent(identity.id))
      .then(function(r){ return r.json().then(function(j){ return { r: r, j: j }; }); })
      .then(function(x){
        if(x.j && x.j.removed){ handleRemoved(); }
        else if(x.r.status === 401){ stopRemote(); pin = null; try{ localStorage.removeItem(PIN_KEY); }catch(e){} showGate('That PIN stopped working — enter the current one.'); }
        else { setTimeout(function(){ if(pin && (!es || es.readyState === EventSource.CLOSED)) connect(); }, 3000); }
      })
      .catch(function(){ setTimeout(function(){ if(pin && (!es || es.readyState === EventSource.CLOSED)) connect(); }, 3000); });
  }

  function startRemote(){
    gateScreen.classList.add('hidden');
    remoteScreen.classList.remove('hidden');
    connect();
    send('requestState');
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function(){ send('requestState'); }, 15000);
  }

  // Phones aggressively suspend background tabs, which can drop the SSE
  // connection or delay updates. Catch up instantly when the tab is looked
  // at again instead of waiting for the next 15s poll.
  document.addEventListener('visibilitychange', function(){
    if(document.hidden || !pin) return;
    if(!es || es.readyState === EventSource.CLOSED){ connect(); }
    send('requestState');
  });

  function showGate(message){
    remoteScreen.classList.add('hidden');
    gateScreen.classList.remove('hidden');
    pinError.textContent = message || '';
    pinInput.value = '';
    pinInput.focus();
  }

  function tryPin(candidate){
    if(!candidate){ pinError.textContent = 'Enter the PIN first.'; return; }
    pinError.textContent = 'Checking…';
    fetch(origin + '/api/verify-pin?pin=' + encodeURIComponent(candidate) + '&id=' + encodeURIComponent(identity.id))
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data && data.removed){
          pinError.textContent = data.message || 'This phone was removed from Presenter on the computer.';
        } else if(data && data.ok){
          pin = candidate;
          localStorage.setItem(PIN_KEY, candidate);
          startRemote();
        } else {
          pinError.textContent = (data && data.message) || 'Wrong PIN — try again.';
        }
      })
      .catch(function(){ pinError.textContent = "Couldn't reach the server. Check the address, and that Tailscale (or the same Wi-Fi) is connected."; });
  }

  pinSubmitBtn.addEventListener('click', function(){ tryPin(pinInput.value.trim()); });
  pinInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryPin(pinInput.value.trim()); });

  let urlPin = null;
  try{
    const qp = new URLSearchParams(location.search).get('pin');
    if(qp){ urlPin = qp; history.replaceState(null, '', location.pathname); }
  }catch(e){}
  const saved = urlPin || localStorage.getItem(PIN_KEY);
  if(saved){ tryPin(saved); } else { showGate(''); }
})();
</script>
<script>
(function(){
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  if(standalone){ var h = document.getElementById('installHint'); if(h) h.remove(); }
  // Haptic tick on every button press (Android; iPhone ignores it).
  document.addEventListener('click', function(e){
    if(e.target.closest('button')){ try{ navigator.vibrate && navigator.vibrate(12); }catch(_){} }
  });
  // Swipe left/right on the Live/Staged cards = Next/Prev.
  var sx = null, sy = null;
  document.querySelectorAll('.card').forEach(function(c){
    c.addEventListener('touchstart', function(e){ var t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, {passive:true});
    c.addEventListener('touchend', function(e){
      if(sx === null) return;
      var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
      if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){ document.getElementById(dx < 0 ? 'nextBtn' : 'prevBtn').click(); }
    }, {passive:true});
  });
})();
</script>
</body>
</html>
