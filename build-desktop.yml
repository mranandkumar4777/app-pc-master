name: Build Desktop App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: presenter-${{ matrix.os }}
          path: |
            dist/Presenter-Setup.exe
            dist/Presenter-Portable.exe
            dist/Presenter-mac.dmg
            dist/Presenter-linux.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Presenter desktop app (latest)
          body: |
            Windows: download Presenter-Setup.exe (installer) or Presenter-Portable.exe (no install).
            Mac: Presenter-mac.dmg. Linux: Presenter-linux.AppImage.
          files: out/*
