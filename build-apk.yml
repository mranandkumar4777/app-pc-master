name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK (shrunk + obfuscated)
        working-directory: phone-app-android
        run: gradle assembleRelease --no-daemon

      - name: Name the APK and write version.json
        working-directory: phone-app-android
        run: |
          cp app/build/outputs/apk/release/app-release.apk ../PresenterRemote.apk
          CODE=$(grep -m1 'versionCode' app/build.gradle.kts | grep -o '[0-9]\+')
          NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]*)".*/\1/')
          cat > ../version.json <<JSON
          {
            "versionCode": $CODE,
            "versionName": "$NAME",
            "url": "https://github.com/${{ github.repository }}/releases/latest/download/PresenterRemote.apk",
            "notes": "Presenter Remote v$NAME."
          }
          JSON
          cat ../version.json

      # Download from the run page (Actions tab -> the run -> Artifacts)
      - uses: actions/upload-artifact@v4
        with:
          name: PresenterRemote-apk
          path: |
            PresenterRemote.apk
            version.json

      # Also publish it to a Release so you can open the repo's Releases page on your phone
      # and tap the APK to install it, and so the app's built-in "Check for updates" can find
      # version.json.
      #
      # Note: the phone fetches these two files with no GitHub login, so that only works if
      # this repository is Public. If you keep it Private, the in-app update check just quietly
      # finds nothing -- everything else about the app still works. See DISTRIBUTION-AND-UPDATES.md.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Presenter Remote (latest)
          body: Install PresenterRemote.apk on your Android phone.
          files: |
            PresenterRemote.apk
            version.json
